[server]
bind = "0.0.0.0:8000"
cors_origins = ["*"]

[[systems]]
id = "axleops"
name = "AxleOps 服务管理"
system_type = "service-mgmt"
base_url = "http://axleops-admin:9000"
auth_type = "session"
status = "online"
version = "v0.4.1"

[[systems]]
id = "eventide"
name = "Eventide 告警中心"
system_type = "alert-center"
base_url = "http://eventide:8080"
auth_type = "token"
auth_token = "eventide-admin-token"
status = "online"
version = "v0.3.0"

[[systems]]
id = "zabbix"
name = "Zabbix 监控"
system_type = "monitoring"
base_url = "http://zabbix:10051"
auth_type = "api_key"
auth_token = "zabbix-api-key"
status = "online"
version = "v7.0"

[[systems]]
id = "elk"
name = "ELK 日志"
system_type = "logging"
base_url = "http://elk:5601"
auth_type = "basic_auth"
auth_username = "elastic"
auth_password = "changeme"
status = "online"
version = "v8.12"
iframe_url = "http://elk:5601/app/kibana"

[[systems]]
id = "prometheus"
name = "Prometheus 指标"
system_type = "metrics"
base_url = "http://prometheus:9090"
auth_type = "none"
status = "online"
version = "v2.50"

[database]
# 与 Eventide 共用同一 MySQL 实例（120.26.105.115），独立库名 meridianops。
# 首次启动 ensure_database_exists 会自动 CREATE DATABASE IF NOT EXISTS。
url = "mysql://root:886363@120.26.105.115:3306/meridianops"
max_connections = 10
min_connections = 1

[auth]
# HMAC secret for JWT signing. 生产环境必须通过 MERIDIANOPS_JWT_SECRET 环境变量覆盖。
jwt_secret = "change-me-to-a-long-random-string"
token_ttl_hours = 24
seed_username = "admin"
seed_password = "admin123!"
enabled = true
